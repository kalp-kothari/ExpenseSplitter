kind = "web"
previewPath = "/"
title = "OPUSOL"
description = "Shared expense frontend with an explicitly labeled demo mode, responsive dashboard, groups and expense views, and a documented API integration proposal. Real authentication and authoritative balances require the independently developed backend."
version = "1.0.0"
id = "artifacts/settle"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18674

[services.development]
run = "pnpm --filter @workspace/settle run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/settle", "run", "build" ]
serve = "static"
publicDir = "artifacts/settle/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18674"
BASE_PATH = "/"
